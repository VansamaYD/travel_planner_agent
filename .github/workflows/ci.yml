name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.22"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --project apps/api --frozen --dev
      - name: Lint and type check
        run: |
          uv run --project apps/api ruff check apps/api/src apps/api/tests
          uv run --project apps/api ruff format --check apps/api/src apps/api/tests
          uv run --project apps/api mypy apps/api/src
          cd apps/api && uv run --frozen lint-imports
      - name: Test
        run: uv run --project apps/api pytest apps/api
      - name: Build
        run: uv build --project apps/api

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
          cache: npm
      - run: npm ci
      - run: npm run web:lint
      - run: npm run web:test
      - run: npm run web:build

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/validate_design_docs.sh
      - run: docker compose -f deploy/compose.yaml config --quiet
