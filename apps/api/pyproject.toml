[project]
name = "travel-planner-api"
version = "0.1.0"
description = "Self-hosted travel planning agent API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "argon2-cffi==25.1.0",
  "cryptography>=50,<51",
  "fastapi==0.141.1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.43,<2.1",
  "structlog>=25.4,<26",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "import-linter>=2.3,<3",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_agent"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["INP001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["travel_agent"]

[[tool.mypy.overrides]]
module = "aiosqlite.*"
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["travel_agent"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Application layers must not depend on frameworks"
type = "forbidden"
source_modules = [
  "travel_agent.modules.access.application",
  "travel_agent.modules.operations.application",
  "travel_agent.modules.trips.application",
  "travel_agent.modules.itinerary.application",
]
forbidden_modules = [
  "fastapi",
  "sqlalchemy",
  "httpx",
]
