name: travel-planner-agent

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite+aiosqlite:////data/db/travel_agent.db
      TRAVEL_DATA_ROOT: /data
    volumes:
      - ${TRAVEL_DATA_DIR:-../runtime/data}:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - ${TRAVEL_WEB_PORT:-8080}:8080
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
